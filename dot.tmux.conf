#https://mutelight.org/practical-tmux

# Highlight active window
#set-window-option -g window-status-current-bg red
set-window-option -g window-status-current-style bg=red

# Allows for faster key repetition
set -s escape-time 0

bind-key b send-prefix

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Keep environment up-to-date with new windows
set -g update-environment -r

# Truecolor support
set -as terminal-overrides ",*-256color:Tc"
#set -as terminal-features ",*-256color:RGB"
#set -g default-terminal "tmux-direct"
#set -g default-terminal "xterm-direct"
#set -g default-terminal "xterm+direct256"
#set -g default-terminal "tmux-direct"
#set -g default-terminal "xterm-direct2"

# Need base FreeBSD (less) to be FreeBSD 14+ for this
#set -g default-terminal "tmux-256color"
set -g default-terminal "screen-256color"

#set -g utf8 on
#set -g status-utf8 on

# Enable ^ba to send input to all panes
bind-key a set-window-option synchronize-panes

# Enable /? in search mode
setw -g mode-keys vi

set-option -g history-limit 10000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# Enable support for vim-tmux-focus-events
set -g focus-events on



bind-key R source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded"

bind-key M-m set-option -g mouse \; display-message 'Mouse #{?mouse,on,off}'

source-file -q ~/.tmux.conf.site
source-file -q ~/.tmux.conf.local

# prefix + C-s saves, prefix + C-r restores.  Plugin itself is vendored as a
# submodule and symlinked by install.sh, so tpm never needs to clone it and
# "prefix + I" is not required on a new host.
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Relaunches vim/nvim as "vim -S" when a Session.vim is present; that file is
# produced by the vim-obsession bundle, without which these are a no-op.
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# Appended to the built-in list, not a replacement for it.  Every entry is
# tilde-prefixed to match anywhere in the saved command, which is stored as a
# full path: a bare "tail" only matches a command starting with it.  "~watch"
# also covers FreeBSD's cmdwatch.
set -g @resurrect-processes '"~watch" "~journalctl" "~tail"'

set -g @plugin 'tmux-plugins/tpm'
run ~/.tmux/plugins/tpm/tpm
