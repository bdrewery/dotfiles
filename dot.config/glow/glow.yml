# style name or JSON path (default "auto")
style: "dracula"
# mouse support (TUI-mode only)
mouse: true
# use pager to display markdown
pager: false
# word-wrap at width -- intentionally unset.  A fixed value here overflows any
# narrower terminal; the glow wrapper in dot.profile.common passes the live
# width instead.
# show all files, including hidden and ignored.
all: false
